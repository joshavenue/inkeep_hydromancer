# Dedicated databases for the Hydromancer Inkeep runtime.
# Image versions match the upstream inkeep/agents docker-compose.yml for the 0.80.x line.
# All ports bind loopback only; the runtime connects over 127.0.0.1.
# Passwords come from deploy/.env, generated by make-compose-env.py from runtime/.env.
services:
  doltgres:
    image: dolthub/doltgresql:0.56.7
    restart: unless-stopped
    environment:
      DOLTGRES_USER: hydromancer_demo
      DOLTGRES_PASSWORD: ${MANAGE_DB_PASSWORD}
      DOLTGRES_DB: inkeep_hydromancer_manage
    ports:
      - "127.0.0.1:18532:5432"
    volumes:
      - doltgres-data:/var/lib/doltgres
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$DOLTGRES_PASSWORD psql -h localhost -U hydromancer_demo -d inkeep_hydromancer_manage -c 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: inkeep_hydromancer_run
      POSTGRES_USER: hydromancer_demo
      POSTGRES_PASSWORD: ${RUN_DB_PASSWORD}
      SPICEDB_DB_PASSWORD: ${SPICEDB_DB_PASSWORD}
    ports:
      - "127.0.0.1:18533:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init-spicedb-db.sh:/docker-entrypoint-initdb.d/10-spicedb.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydromancer_demo -d inkeep_hydromancer_run"]
      interval: 5s
      timeout: 3s
      retries: 30

  spicedb-migrate:
    image: authzed/spicedb:v1.49.2
    command: ["migrate", "head"]
    restart: on-failure
    environment:
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: postgres://spicedb:${SPICEDB_DB_PASSWORD}@postgres:5432/spicedb?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  spicedb:
    image: authzed/spicedb:v1.49.2
    command: ["serve"]
    restart: unless-stopped
    environment:
      SPICEDB_GRPC_PRESHARED_KEY: ${SPICEDB_PRESHARED_KEY}
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: postgres://spicedb:${SPICEDB_DB_PASSWORD}@postgres:5432/spicedb?sslmode=disable
      SPICEDB_HTTP_ENABLED: "false"
      SPICEDB_TELEMETRY_ENDPOINT: ""
      SPICEDB_METRICS_ENABLED: "false"
    ports:
      - "127.0.0.1:18551:50051"
    depends_on:
      postgres:
        condition: service_healthy
      spicedb-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: 5s
      timeout: 30s
      retries: 10

volumes:
  doltgres-data:
  postgres-data:
